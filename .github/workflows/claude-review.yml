name: Claude Review

on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, labeled ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@0ebed4dba52459ee762d416def8ae08e4f8b69ba
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
