name: Claude Review

on:
  pull_request:
    branches: [ 'master', '*.x' ]
    types: [ opened, ready_for_review, synchronize ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@0f9937c07280c52b8480eb38de524a4ced39d363
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
