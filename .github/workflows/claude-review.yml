name: Claude Review

on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@f0eddf6b0c08d044cf4dec3d3e09738c4a4e432d
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
