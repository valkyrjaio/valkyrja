name: Claude Review

on:
  pull_request:
    types: [ opened, ready_for_review, synchronize ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@cae11be22f6a4147e92044e9256b53ee080ad622
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
