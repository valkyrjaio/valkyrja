name: Claude Review

on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@bf51850f7e9b50e40e13dd62022ee56c548f616e
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
