name: Claude Review

on:
  pull_request:
    branches: [ 'master', '*.x' ]
    types: [ opened, ready_for_review, synchronize ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@09dea16834afe9016704cc57fa49f351bc55af6c
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
