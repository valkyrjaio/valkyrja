name: Claude Review

on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@6bfd75231afaebd9e9681fe6b2ad2b9a083a6371
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
