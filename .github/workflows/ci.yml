name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks against the new base. A
    # base-branch change has no activity type of its own; GitHub reports it as `edited`, and `edited`
    # is not one of the default types, so such a pull request otherwise sits with no checks at all.
    #
    # `edited` also fires for title and description edits, so the whole suite re-runs for those too.
    # That cost is accepted deliberately. Skipping the jobs instead — via a `changes.base` guard —
    # does not work: a skipped caller job never produces the `<job> / <job>` context the required
    # status checks are waiting for, and GitHub evaluates requirements against the latest run, so an
    # earlier run's success does not carry over. The pull request ends up blocked on
    # "Expected — Waiting for status to be reported" until someone pushes a commit.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  phparkitect:
    name: PHPArkitect
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'phparkitect'
      php-version: '8.4'
      paths: |
        ci:
          - '.github/ci/phparkitect/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phparkitect/**'
          - '.github/workflows/ci.yml'
          - 'bin/valkyrja'
          - 'functions/**/*.php'
          - 'src/**/*.php'
          - 'tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  phpcodesniffer:
    name: PHP Code Sniffer
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'phpcodesniffer'
      php-version: '8.4'
      paths: |
        ci:
          - '.github/ci/phpcodesniffer/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phpcodesniffer/**'
          - '.github/workflows/ci.yml'
          - 'bin/valkyrja'
          - 'functions/**/*.php'
          - 'src/**/*.php'
          - 'tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  phpcsfixer:
    name: PHP CS Fixer
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'phpcsfixer'
      php-version: '8.4'
      paths: |
        ci:
          - '.github/ci/phpcsfixer/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phpcsfixer/**'
          - '.github/workflows/ci.yml'
          - 'bin/valkyrja'
          - 'functions/**/*.php'
          - 'src/**/*.php'
          - 'tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  phpstan:
    name: PHPStan
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'phpstan'
      php-version: '8.4'
      additional-directory: '.github/ci/root-and-suggested'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      paths: |
        ci:
          - '.github/ci/phpstan/**'
          - '.github/ci/root-and-suggested/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phpstan/**'
          - '.github/ci/root-and-suggested/**'
          - '.github/workflows/ci.yml'
          - 'bin/valkyrja'
          - 'functions/**/*.php'
          - 'src/**/*.php'
          - 'tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  phpunit:
    name: PHPUnit
    uses: valkyrjaio/ci-phpunit-php/.github/workflows/_workflow-call.yml@ca27f8c28932012e8ec6e25c9c949bc410e68b02
    with:
      php-versions: '["8.4", "8.5", "8.6"]'
      php-version-bleeding-edge: '8.6'
      additional-directory: '.github/ci/root-and-suggested'
      extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-mysql, php-sqlite3, php-pgsql, pdo_sqlite, pdo_pgsql, pdo_mysql, openswoole, xdebug'
      composer-options: '--ignore-platform-req=ext-openswoole'
      paths: |
        ci:
          - '.github/ci/phpunit/**'
          - '.github/ci/root-and-suggested/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/phpunit/**'
          - '.github/ci/root-and-suggested/**'
          - '.github/workflows/ci.yml'
          - 'bin/valkyrja'
          - 'functions/**/*.php'
          - 'src/**/*.php'
          - 'tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  psalm:
    name: Psalm
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'psalm'
      php-version: '8.4'
      additional-directory: '.github/ci/root-and-suggested'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      run-script: 'psalm-shepherd-with-stats'
      paths: |
        ci:
          - '.github/ci/psalm/**'
          - '.github/ci/root-and-suggested/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/psalm/**'
          - '.github/ci/root-and-suggested/**'
          - '.github/workflows/ci.yml'
          - 'bin/valkyrja'
          - 'functions/**/*.php'
          - 'src/**/*.php'
          - 'tests/**/*.php'
          - 'composer.json'
    secrets: inherit

  rector:
    name: Rector
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'rector'
      php-version: '8.4'
      paths: |
        ci:
          - '.github/ci/rector/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/rector/**'
          - '.github/workflows/ci.yml'
          - 'bin/valkyrja'
          - 'functions/**/*.php'
          - 'src/**/*.php'
          - 'tests/**/*.php'
          - 'composer.json'
    secrets: inherit
