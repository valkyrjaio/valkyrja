name: CI

on:
  push:
    branches: [ 'master', '*.x' ]

  pull_request:
    # `edited` is deliberately absent. It fires for a title or description edit, and this workflow
    # checks file content, which an edit cannot change. Running it on an edit would cost the full
    # tool suite for a typo. Guarding the jobs on `github.event.changes` instead does not work and
    # is not safe: a caller job skipped by `if:` never produces the `<job> / <job>` context the
    # required status checks wait for, so the pull request blocks; and a guard inside the job would
    # report success without running the tools, so an edit on a red pull request would turn it
    # green. Pull request metadata is checked by `pr.yml`, which does subscribe to `edited`.
    types: [ opened, synchronize, reopened ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:


  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@bf51850f7e9b50e40e13dd62022ee56c548f616e
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  # A check's name is built from every job name down the call chain, so this composes
  # as `CI / Tools / <Tool> / …`.
  tools:
    name: Tools
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tools.yml@bf51850f7e9b50e40e13dd62022ee56c548f616e
    with:
      php-version: '8.4'
      additional-directory: '.github/ci/root-and-suggested'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      php-versions: '["8.4", "8.5", "8.6"]'
      php-version-bleeding-edge: '8.6'
      phpunit-extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-mysql, php-sqlite3, php-pgsql, pdo_sqlite, pdo_pgsql, pdo_mysql, openswoole, xdebug'
      psalm-run-script: 'psalm-shepherd-with-stats'
      source-paths: |
        bin/valkyrja
        functions/**/*.php
        src/**/*.php
        tests/**/*.php
        composer.json
    secrets: inherit
