name: CI

on:
  push:
    branches: [ 'master', '*.x' ]

  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks against the new base. A
    # base-branch change has no activity type of its own; GitHub reports it as `edited`, and `edited`
    # is not one of the default types, so such a pull request otherwise sits with no checks at all.
    #
    # `edited` also fires for title and description edits, so the whole suite re-runs for those too.
    # That cost is accepted deliberately. Skipping the jobs instead — via a `changes.base` guard —
    # does not work: a skipped caller job never produces the `<job> / <job>` context the required
    # status checks are waiting for, and GitHub evaluates requirements against the latest run, so an
    # earlier run's success does not carry over. The pull request ends up blocked on
    # "Expected — Waiting for status to be reported" until someone pushes a commit.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:

  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@0f9937c07280c52b8480eb38de524a4ced39d363
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@0f9937c07280c52b8480eb38de524a4ced39d363
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  # A check's name is built from every job name down the call chain, so this composes
  # as `CI / Tools / <Tool> / …`.
  tools:
    name: Tools
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tools.yml@0f9937c07280c52b8480eb38de524a4ced39d363
    with:
      php-version: '8.4'
      additional-directory: '.github/ci/root-and-suggested'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      php-versions: '["8.4", "8.5", "8.6"]'
      php-version-bleeding-edge: '8.6'
      phpunit-extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-mysql, php-sqlite3, php-pgsql, pdo_sqlite, pdo_pgsql, pdo_mysql, openswoole, xdebug'
      psalm-run-script: 'psalm-shepherd-with-stats'
      source-paths: |
        bin/valkyrja
        functions/**/*.php
        src/**/*.php
        tests/**/*.php
        composer.json
    secrets: inherit
