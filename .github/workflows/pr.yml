name: PR

on:
  pull_request:
    # `edited` fires for a title or description edit, and for a base-branch change — which is how
    # GitHub reports the auto-retarget a stacked pull request gets when its parent merges. Both are
    # pull request metadata, and this workflow checks pull request metadata, so both belong here.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:

  commit-message-check:
    name: Commit Message Check
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@06472907a89cf175883fb9f82d5903fb0b43bea4
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
