name: Create Major Release Version Branch

on: workflow_dispatch

run-name: Create new version for upcoming major release

jobs:
  check-outdated-dependencies:
    name: Check Outdated Dependencies
    uses: valkyrjaio/.github/.github/workflows/_check-outdated-php-dependencies.yml@master
    secrets: inherit
    with:
      php-version: '8.4'
      dependencies: |
        [
          {"name": "Root and Suggested Packages", "command": "root-and-suggested-outdated-check-major-release"},
          {"name": "PHPArkitect",                 "command": "phparkitect-outdated-check-major-release"},
          {"name": "PHP Code Sniffer",             "command": "phpcodesniffer-outdated-check-major-release"},
          {"name": "PHP CS Fixer",                 "command": "phpcsfixer-outdated-check-major-release"},
          {"name": "PHPStan",                      "command": "phpstan-outdated-check-major-release"},
          {"name": "PHPUnit",                      "command": "phpunit-outdated-check-major-release"},
          {"name": "Psalm",                        "command": "psalm-outdated-check-major-release"},
          {"name": "Rector",                       "command": "rector-outdated-check-major-release"}
        ]

  get-version:
    needs: check-outdated-dependencies
    uses: valkyrjaio/.github/.github/workflows/_get-version.yml@master
    secrets: inherit

  create:
    needs: get-version
    uses: valkyrjaio/.github/.github/workflows/_create-version-branch.yml@master
    secrets: inherit
    with:
      version: ${{ needs.get-version.outputs.version }}
      branch: ${{ needs.get-version.outputs.branch }}

  update-composer:
    needs: [create, get-version]

    name: "Update composer.json for ${{ needs.get-version.outputs.branch }}"

    runs-on: ubuntu-latest

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-version.outputs.branch }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update composer.json
        env:
          BRANCH: ${{ needs.get-version.outputs.branch }}
        run: |
          sed -i "s/\"dev-master\" : \"*-dev\"/\"dev-master\" : \"$BRANCH-dev\"/g" composer.json

      - name: Commit composer.json update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[${{ needs.get-version.outputs.branch }}] Update composer.json for v${{ needs.get-version.outputs.version }}"
