name: Restore Branch From Backup

on:
  workflow_dispatch:

run-name: "Restore ${{ github.ref_name }} from ${{ github.ref_name }}-backup"

jobs:
  restore:
    uses: valkyrjaio/.github/.github/workflows/_restore-branch-from-backup.yml@f01d57cdbf39e7654f5c4bee4102870c55e5f995
    permissions:
      contents: write
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
