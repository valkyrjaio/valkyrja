name: Rebase to Master

on:
  workflow_dispatch:
    inputs:
      allow_diverged:
        description: 'Rebase even when master holds commits of its own'
        type: boolean
        default: false

run-name: "Rebase ${{ github.ref_name }} to master"

jobs:
  rebase:
    uses: valkyrjaio/.github/.github/workflows/_rebase-to-master.yml@bf51850f7e9b50e40e13dd62022ee56c548f616e
    permissions:
      contents: write
    secrets: inherit
    with:
      allow_diverged: ${{ inputs.allow_diverged }}
